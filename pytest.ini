[pytest]
testpaths = tests
asyncio_mode = auto
# One event loop for the whole run: asyncpg connections in the engine pool
# are bound to the loop that created them, and a loop per test breaks them.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
markers =
    real_health_probe: let app.services.agents probe MCP_SERVER_URL/health through httpx (mock it with httpx_mock)
