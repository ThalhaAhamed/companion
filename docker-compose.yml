# Meet Companion with Docker.
#
#   docker compose up -d            # app on http://localhost:8000, SQLite in a volume
#   docker compose --profile postgres up -d
#                                   # same, plus a pgvector Postgres the app is pointed at
#
# The first visit walks through onboarding. Configuration saved there lives
# in the `data` volume together with the database and the embedding model.
#
# The port is published on 127.0.0.1 only. Until the first account exists,
# setup has no password, and the first account administers the server - so
# a server reachable from the network goes to whoever opens it first.
# To reach it from other machines, finish setup first (an SSH tunnel works:
# ssh -L 8000:localhost:8000 you@server), or lock setup with SETUP_TOKEN,
# then publish the port on all interfaces:
#
#   SETUP_TOKEN=auto APP_BIND=0.0.0.0 docker compose up -d
#   docker compose logs app | grep setup_token   # the one-time setup link
#
# Docker's port rules bypass host firewalls such as ufw. For anything public,
# put a reverse proxy with HTTPS in front (see SECURITY.md).

services:
  app:
    build: .
    container_name: meet_companion
    ports:
      - "${APP_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - data:/data
    environment:
      # Set these to skip onboarding and run fully declaratively:
      # LLM_PROVIDER: openai
      # LLM_API_KEY: ${LLM_API_KEY}
      # MEETSTREAM_API_KEY: ${MEETSTREAM_API_KEY}
      # MEETSTREAM_WEBHOOK_SECRET: ${MEETSTREAM_WEBHOOK_SECRET}
      # SESSION_SECRET: ${SESSION_SECRET}
      # Lock first-run setup behind a token ("auto" prints a setup link to the log):
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Public URL MeetStream can reach for webhooks and MCP (see README):
      # MCP_SERVER_URL: https://companion.example.com/mcp
      CORS_ORIGINS: '["http://localhost:8000"]'
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg17
    container_name: meet_companion_db
    environment:
      POSTGRES_DB: meet_companion
      POSTGRES_USER: meet
      # Set POSTGRES_PASSWORD in .env for anything but a local try-out.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meet_dev_password}
    # Loopback only: Docker's port rules bypass host firewalls such as ufw,
    # and the app reaches the database over the compose network anyway.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meet -d meet_companion"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  data:
  pgdata:
